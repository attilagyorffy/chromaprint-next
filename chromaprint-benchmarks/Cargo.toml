[package]
name = "chromaprint-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chromaprint-next = { path = "../chromaprint-next" }
rusty-chromaprint = { path = "../rusty-chromaprint/chromaprint" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[build-dependencies]
cmake = "0.1"

[[bench]]
name = "fingerprint"
harness = false

[[bench]]
name = "stages"
harness = false

[[bench]]
name = "kernels"
harness = false
